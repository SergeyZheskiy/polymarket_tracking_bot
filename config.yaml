# Настройки бота. Токен и id админов -- в .env (пример -- .env.example).

# Список отслеживаемых кошельков: адрес или ссылка на профиль, по одному
# на строку. Правится только руками, через Telegram его поменять нельзя.
# Бот перечитывает файл сам, перезапуск не нужен. Пример -- wallets.example.txt.
wallets: wallets.txt

# false -- бот по приглашению: незнакомец жмёт /start, админу приходит
#          заявка с кнопками «Разрешить» / «Отклонить».
# true  -- открытый: сигналы получает любой, кто нажал /start.
open: false

# Не присылать, пока сумма серии (см. merge_minutes) меньше этой, $. 0 -- присылать всё.
min_usdc: 0

# Крупную заявку часто исполняют десятки встречных сделок подряд. Все
# сделки одного кошелька в один исход одного маркета, между которыми
# меньше merge_minutes, идут ОДНИМ сообщением: первое приходит сразу,
# потом в нём обновляются сумма и число сделок (без нового уведомления).
merge_minutes: 10

# Сколько секунд копить сделки перед отправкой или обновлением сообщения.
group_seconds: 3

# Основной источник -- живой поток сделок (доли секунды). Дополнительно
# раз в poll_seconds бот опрашивает историю каждого кошелька, чтобы не
# пропустить сделки, пришедшие, пока поток переподключался. 0 -- выключить.
poll_seconds: 20

# Где бот хранит подписчиков и одобренных пользователей.
chats_file: data/chats.txt
users_file: data/users.csv
