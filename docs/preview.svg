<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1621"/>
      <stop offset="1" stop-color="#17212b"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#2a5cb8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="720" height="380" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="380" fill="url(#bg)"/>

    <!-- шапка чата -->
    <rect width="720" height="64" fill="#17212b"/>
    <rect y="64" width="720" height="1" fill="#0b121a"/>
    <circle cx="44" cy="32" r="20" fill="url(#avatar)"/>
    <text x="44" y="38.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PS</text>
    <text x="78" y="28" font-size="16" font-weight="600" fill="#f5f5f5">Polymarket Signals</text>
    <text x="78" y="48" font-size="13" fill="#7f91a4">бот</text>

    <!-- сообщение -->
    <rect x="28" y="88" width="664" height="258" rx="14" fill="#182533"/>
    <g font-size="17" fill="#f5f5f5">
      <text x="50" y="124" font-weight="700">🟢 ПОКУПКА</text>
      <text x="50" y="158">👤 <tspan fill="#6ab3f3">flawfence</tspan></text>
      <text x="50" y="192">💵 <tspan font-weight="700">$2,006.26</tspan> — 13,375.09 шт. × 15.0¢ на «Yes»</text>
      <text x="50" y="226">📊 <tspan fill="#6ab3f3">Will Yashar win the most seats in the 2026</tspan></text>
      <text x="73" y="250" fill="#6ab3f3">Israeli legislative election?</text>
      <text x="50" y="286">🧩 23 сделки за 51 с, последняя в 23:40:57</text>
    </g>
    <text x="672" y="330" text-anchor="end" font-size="12.5" fill="#6d7f8f">изменено 23:41</text>

  </g>
</svg>
